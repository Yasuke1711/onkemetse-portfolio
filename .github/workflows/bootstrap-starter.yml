name: Unpack the portfolio starter

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/part-*.b64"
      - ".github/workflows/bootstrap-starter.yml"

permissions:
  contents: write

jobs:
  unpack-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Bring the repo down to earth
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Open the suitcase
        run: |
          mkdir -p /tmp/portfolio-starter
          cat bootstrap/part-*.b64 | base64 -d > /tmp/onkemetse-portfolio-starter.tar.xz
          tar -xJf /tmp/onkemetse-portfolio-starter.tar.xz -C /tmp/portfolio-starter
          cp -a /tmp/portfolio-starter/onkemetse-portfolio/. .
          rm -rf bootstrap

      - name: Give the files a proper address in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Diary, day two: opened the suitcase. The actual website was in there."
          git push origin HEAD:main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the dependencies (the boring but necessary bit)
        run: npm install --no-audit --no-fund

      - name: Make sure the thing stands up
        run: |
          npm run lint
          npm run typecheck
          npm run build
