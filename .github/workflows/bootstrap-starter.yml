name: Portfolio checks (because vibes are not a build system)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-the-thing:
    runs-on: ubuntu-latest
    steps:
      - name: Bring the code into the room
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the usual suspects
        run: npm install --no-audit --no-fund

      - name: Check the code, then build the thing
        run: |
          npm run lint
          npm run typecheck
          npm run build
